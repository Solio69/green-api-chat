<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Два цветовых референса страницы входа GREEN-API Chat</title>
  <desc id="desc">Вариант А: спокойный фон, белая карточка, тёмно-зелёная кнопка с белым текстом. Вариант Б: светло-зелёный фон, белая карточка, кнопка фирменного цвета с тёмным текстом.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #1f1f1f; }
      .page-title { font-size: 34px; font-weight: 700; }
      .sub { font-size: 17px; fill: #505a51; }
      .variant { font-size: 23px; font-weight: 700; }
      .tag { font-size: 15px; font-weight: 700; fill: #2b6f04; }
      .heading { font-size: 27px; font-weight: 700; }
      .hint { font-size: 16px; fill: #555e56; }
      .label { font-size: 17px; font-weight: 600; }
      .helper { font-size: 15px; fill: #535d55; }
      .button { font-size: 18px; font-weight: 700; }
      .button--light { fill: #ffffff; }
      .brand-link { fill: #337f02; text-decoration: underline; }
      .caption { font-size: 16px; fill: #465047; }
      .swatch { font-size: 15px; font-weight: 600; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="17" flood-color="#1c3e22" flood-opacity="0.11"/>
    </filter>
    <symbol id="eye" viewBox="0 0 24 24">
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" fill="none" stroke="#3b9702" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="3" fill="none" stroke="#3b9702" stroke-width="1.75"/>
    </symbol>
  </defs>

  <rect width="1600" height="940" fill="#f6f8f5"/>
  <text x="50" y="65" class="page-title">Палитра для экрана входа</text>
  <text x="50" y="99" class="sub">Визуальные референсы: одинаковая форма, разное распределение фирменных цветов</text>

  <!-- A: restrained use of the supplied palette. -->
  <rect x="40" y="130" width="740" height="690" rx="22" fill="#ffffff" stroke="#dce4dd"/>
  <text x="70" y="173" class="variant">А · Спокойный фон</text>
  <rect x="590" y="146" width="160" height="34" rx="17" fill="#e7f6df"/>
  <text x="670" y="169" text-anchor="middle" class="tag">Рекомендую</text>
  <rect x="66" y="196" width="688" height="580" rx="15" fill="#f4f7f4"/>
  <rect x="136" y="238" width="548" height="495" rx="20" fill="#ffffff" stroke="#b7eb8f" filter="url(#shadow)"/>
  <path d="M156 238h508a20 20 0 0 1 20 20v2H136v-2a20 20 0 0 1 20-20Z" fill="#abffac"/>
  <text x="170" y="306" class="heading">Подключение к GREEN-API</text>
  <text x="170" y="342" class="hint">Оба поля обязательны</text>
  <text x="170" y="385" class="label">idInstance</text>
  <rect x="170" y="398" width="480" height="48" rx="9" fill="#ffffff" stroke="#77867a"/>
  <text x="170" y="492" class="label">apiTokenInstance</text>
  <rect x="170" y="505" width="480" height="48" rx="9" fill="#ffffff" stroke="#77867a"/>
  <use href="#eye" x="612" y="518" width="23" height="23"/>
  <rect x="170" y="587" width="480" height="50" rx="9" fill="#337f02"/>
  <text x="410" y="619" text-anchor="middle" class="button button--light">Войти</text>
  <text x="170" y="671" class="helper">idInstance и apiTokenInstance находятся в</text>
  <text x="170" y="692" class="helper brand-link">личном кабинете GREEN-API</text>
  <text x="390" y="692" class="helper">на странице инстанса.</text>
  <text x="170" y="712" class="helper">Откроется в новой вкладке.</text>

  <!-- B: dense brand-colored background and exact supplied CTA green. -->
  <rect x="820" y="130" width="740" height="690" rx="22" fill="#ffffff" stroke="#dce4dd"/>
  <text x="850" y="173" class="variant">Б · Зелёный фон</text>
  <rect x="846" y="196" width="688" height="580" rx="15" fill="#abffac"/>
  <rect x="916" y="238" width="548" height="495" rx="20" fill="#ffffff" stroke="#b7eb8f" filter="url(#shadow)"/>
  <path d="M936 238h508a20 20 0 0 1 20 20v2H916v-2a20 20 0 0 1 20-20Z" fill="#b7eb8f"/>
  <text x="950" y="306" class="heading">Подключение к GREEN-API</text>
  <text x="950" y="342" class="hint">Оба поля обязательны</text>
  <text x="950" y="385" class="label">idInstance</text>
  <rect x="950" y="398" width="480" height="48" rx="9" fill="#ffffff" stroke="#77867a"/>
  <text x="950" y="492" class="label">apiTokenInstance</text>
  <rect x="950" y="505" width="480" height="48" rx="9" fill="#ffffff" stroke="#77867a"/>
  <use href="#eye" x="1392" y="518" width="23" height="23"/>
  <rect x="950" y="587" width="480" height="50" rx="9" fill="#3b9702"/>
  <text x="1190" y="619" text-anchor="middle" class="button">Войти</text>
  <text x="950" y="671" class="helper">idInstance и apiTokenInstance находятся в</text>
  <text x="950" y="692" class="helper brand-link">личном кабинете GREEN-API</text>
  <text x="1170" y="692" class="helper">на странице инстанса.</text>
  <text x="950" y="712" class="helper">Откроется в новой вкладке.</text>

  <text x="50" y="858" class="caption">А: белая карточка и светлые акценты; кнопку затемнили ради читаемого белого текста.</text>
  <text x="830" y="858" class="caption">Б: весь фон #abffac; на точном #3b9702 текст кнопки тёмный.</text>
  <rect x="50" y="882" width="26" height="26" rx="5" fill="#3b9702"/>
  <text x="86" y="902" class="swatch">#3b9702</text>
  <rect x="215" y="882" width="26" height="26" rx="5" fill="#abffac" stroke="#c6dcc7"/>
  <text x="251" y="902" class="swatch">#abffac</text>
  <rect x="380" y="882" width="26" height="26" rx="5" fill="#b7eb8f" stroke="#c6dcc7"/>
  <text x="416" y="902" class="swatch">#b7eb8f</text>
  <rect x="545" y="882" width="26" height="26" rx="5" fill="#1f1f1f"/>
  <text x="581" y="902" class="swatch">rgba(0, 0, 0, 0.88)</text>
</svg>
